name: Deploy Test Reports to GitHub Pages

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Run All Tests & Generate Reports"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install unittest-xml-reporting

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
        run: |
          cd backend
          coverage run manage.py test --verbosity=2
          coverage html -d coverage-html

      - name: Run Frontend Unit Tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit-report.xml --reporter=html --outputFile.html=vitest-html-report/index.html

      - name: Run E2E Tests
        run: |
          npx playwright install --with-deps
          npm run test:e2e

      - name: Aggregate Reports for Deploy
        run: |
          mkdir -p public
          cp docs/reports-index.html public/index.html
          cp -r backend/coverage-html public/backend-coverage
          cp -r vitest-html-report public/frontend-unit
          cp -r playwright-report public/frontend-e2e

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
